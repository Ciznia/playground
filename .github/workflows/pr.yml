name: verify pr definition
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  verify-code-guidelines:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./virtuotech-api
    strategy:
      fail-fast: false
      matrix:
        actions:
          - name: lint
            command: "lint"
          - name: format
            command: "format -- --check"
          - name: build
            command: "build"
          - name: typecheck
            command: "typecheck"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
          package-manager-cache: true
          cache-dependency-path: "./virtuotech-api/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: verify ${{ matrix.actions.name }}
        run: npm run ${{ matrix.actions.command }}

  verify-code-coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./virtuotech-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
          package-manager-cache: true
          cache-dependency-path: "./virtuotech-api/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test


      - name: Upload results to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  verify-pr-metadata:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: ./virtuotech-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
          package-manager-cache: true
          cache-dependency-path: "./virtuotech-api/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: PR Quality Bot
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const cwd = `${process.env.GITHUB_WORKSPACE}/virtuotech-api`;

            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = pr.number;

            const marker = '<!-- pr-quality-bot -->';

            let errors = [];
            let warnings = [];

            // -------------------------
            // Validate PR title
            // -------------------------
            try {
              execSync(
                `echo ${JSON.stringify(pr.title)} | npx --no-install commitlint`,
                { stdio: 'pipe', cwd }
              );
            } catch (e) {
              errors.push(`### PR title error\n\n\`\`\`\n${e.stdout?.toString() || e.message}\n\`\`\``);
            }

            // -------------------------
            // Validate commits
            // -------------------------
            try {
              execSync(
                `npx --no-install commitlint --from ${pr.base.sha} --to ${pr.head.sha}`,
                { stdio: 'pipe', cwd }
              );
            } catch (e) {
              errors.push(`### PR commit names error\n\n\`\`\`\n${e.stdout?.toString() || e.message}\n\`\`\``);
            }

            // -------------------------
            // Validate PR body
            // ------------------------
            const body = (pr.body || '').trim();
            const minLength = 50;

            if (!body) {
              errors.push('### PR body is required');
            } else if (body.length < minLength) {
              errors.push(`### PR body too short\n\n(${body.length}/${minLength} characters)`);
            }

            // -------------------------
            // Build message
            // -------------------------
            let message = `${marker}\n`;

            if (errors.length === 0) {
              message += `# PR Quality Check Passed\n\nEverything looks good`;
            } else {
              message += `# PR Quality Check Failed\n\n`;
              message += `## Errors\n\n`;
              message += errors.join('\n') + '\n\n';
              message += `## Requirements\n`;
              message += `- Title must follow commitlint convention\n`;
              message += `- All commits must follow commitlint\n`;
              message += `- PR body must be at least ${minLength} characters\n`;
            }

            // -------------------------
            // Submit review
            // -------------------------
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner,
              repo,
              pull_number,
            });

            const existing = reviews
              .filter(r => r.user.type === 'Bot')
              .reverse()
              .find(r => r.body && r.body.includes(marker));

            const event = errors.length === 0 ? 'APPROVE' : 'REQUEST_CHANGES';

            await github.rest.pulls.createReview({
              owner,
              repo,
              pull_number,
              body: message,
              event,
            });

            if (errors.length > 0) {
              core.setFailed('PR quality checks failed');
            }
