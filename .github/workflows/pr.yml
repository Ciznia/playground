name: verify pr definition
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:

jobs:
  verify-code-guidelines:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./virtuotech-api
    strategy:
      fail-fast: false
      matrix:
        actions:
          - name: lint
            command: "lint"
          - name: test
            command: "test"
          - name: format
            command: "format -- --check"
          - name: build
            command: "build"
          - name: typecheck
            command: "typecheck"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
          package-manager-cache: true
          cache-dependency-path: "./virtuotech-api/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: verify ${{ matrix.actions.name }}
        run: npm run ${{ matrix.actions.command }}
