name: Verify PR Definition

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  # -----------------------------------------------------------------------------
  # Run lint / format / build / typecheck in parallel.
  # Each leg uploads a one-line artifact so post-review can show per-check status
  # -----------------------------------------------------------------------------
  verify-code-guidelines:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./virtuotech-api
    strategy:
      fail-fast: false
      matrix:
        action:
          - name: lint
            command: lint
          - name: format
            command: "format -- --check"
          - name: build
            command: build
          - name: typecheck
            command: typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          package-manager-cache: true
          cache-dependency-path: ./virtuotech-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ${{ matrix.action.name }}
        id: check
        run: npm run ${{ matrix.action.command }}

      # Write "success" or "failure" so post-review can read per-check outcomes.
      - name: Save result
        if: always()
        run: echo "${{ steps.check.outcome }}" > /tmp/check-result.txt

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guidelines-${{ matrix.action.name }}
          path: /tmp/check-result.txt
          retention-days: 1

  # -----------------------------------------------------------------------------
  # Run the test suite and push coverage to Codecov.
  # Builds its own review section so post-review only needs to read a file.
  # -----------------------------------------------------------------------------
  verify-code-coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./virtuotech-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          package-manager-cache: true
          cache-dependency-path: ./virtuotech-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        id: tests
        run: npm run test

      - name: Upload results to Codecov
        if: always()
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./virtuotech-api/coverage/lcov.info

      - name: Build section
        if: always()
        run: |
          outcome="${{ steps.tests.outcome }}"
          icon=$([ "$outcome" = "success" ] && echo "✅" || echo "❌")
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          {
            echo "## 🧪 Tests"
            echo ""
            echo "### Requirements"
            echo ""
            echo "${icon} Test suite passes"
            echo ""
            echo "### Errors"
            echo ""
            if [ "$outcome" = "success" ]; then
              echo "_No errors_"
            else
              echo "Test suite failed. Check the [CI logs](${run_url}) for details."
            fi
          } > /tmp/section-tests.md

      - name: Upload section artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: section-tests
          path: /tmp/section-tests.md
          retention-days: 1

  # -----------------------------------------------------------------------------
  # Validate PR title, commits, and body via commitlint.
  # Builds its own review section so post-review only needs to read a file.
  # -----------------------------------------------------------------------------
  verify-pr-metadata:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./virtuotech-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          package-manager-cache: true
          cache-dependency-path: ./virtuotech-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate PR metadata and build section
        id: validate
        uses: actions/github-script@v9
        with:
          script: |
            const { execSync } = require('child_process');
            const fs  = require('fs');
            const cwd = `${process.env.GITHUB_WORKSPACE}/virtuotech-api`;
            const pr  = context.payload.pull_request;

            const checks = [
              { key: 'title',   label: 'PR title follows commitlint convention',   passed: false },
              { key: 'commits', label: 'All commits follow commitlint convention', passed: false },
              { key: 'body',    label: 'PR body is at least 50 characters',        passed: false },
            ];
            const errors = [];

            // --- Validate PR title ---
            try {
              execSync(
                `echo ${JSON.stringify(pr.title)} | npx --no-install commitlint`,
                { stdio: 'pipe', cwd }
              );
              checks.find(c => c.key === 'title').passed = true;
            } catch (e) {
              errors.push(
                '**PR title does not follow commitlint convention**\n\n' +
                '```\n' + (e.stdout?.toString().trim() || e.message) + '\n```'
              );
            }

            // --- Validate commits ---
            try {
              execSync(
                `npx --no-install commitlint --from ${pr.base.sha} --to ${pr.head.sha}`,
                { stdio: 'pipe', cwd }
              );
              checks.find(c => c.key === 'commits').passed = true;
            } catch (e) {
              errors.push(
                '**One or more commits do not follow commitlint convention**\n\n' +
                '```\n' + (e.stdout?.toString().trim() || e.message) + '\n```'
              );
            }

            // --- Validate PR body ---
            const body      = (pr.body || '').trim();
            const minLength = 50;

            if (body.length >= minLength) {
              checks.find(c => c.key === 'body').passed = true;
            } else if (!body) {
              errors.push('**PR body is required**');
            } else {
              errors.push(`**PR body is too short** (${body.length}/${minLength} characters)`);
            }

            // --- Build section ---
            const requirements = checks
              .map(c => `${c.passed ? '✅' : '❌'} ${c.label}`)
              .join('\n');

            const errorsBlock = errors.length > 0
              ? errors.join('\n\n')
              : '_No errors_';

            const section = [
              '## 📋 PR Metadata',
              '',
              '### Requirements',
              '',
              requirements,
              '',
              '### Errors',
              '',
              errorsBlock,
            ].join('\n');

            fs.writeFileSync('/tmp/section-metadata.md', section);

            if (errors.length > 0) {
              core.setFailed('PR metadata validation failed');
            }

      - name: Upload section artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: section-metadata
          path: /tmp/section-metadata.md
          retention-days: 1

  # -----------------------------------------------------------------------------
  # Download all section artifacts, assemble the full review, and post it.
  # Codecov is always a placeholder here; pr-codecov-review.yml fills it in
  # once Codecov posts its status event.
  # -----------------------------------------------------------------------------
  post-review:
    needs: [verify-code-guidelines, verify-code-coverage, verify-pr-metadata]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts

      - name: Assemble and post review
        uses: actions/github-script@v9
        env:
          COVERAGE_RESULT: ${{ needs.verify-code-coverage.result }}
          METADATA_RESULT: ${{ needs.verify-pr-metadata.result }}
        with:
          script: |
            const fs   = require('fs');
            const path = require('path');

            const owner       = context.repo.owner;
            const repo        = context.repo.repo;
            const pr          = context.payload.pull_request;
            const pull_number = pr.number;
            const runUrl      = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${context.runId}`;

            // Stable markers used by pr-codecov-review.yml for section replacement
            const MARKER        = '<!-- pr-quality-bot -->';
            const SHA_MARKER    = `<!-- pr-sha: ${pr.head.sha} -->`;
            const CODECOV_START = '<!-- codecov-section-start -->';
            const CODECOV_END   = '<!-- codecov-section-end -->';

            const artifacts = '/tmp/artifacts';

            // Read a file from the downloaded artifact tree, null if missing
            const readArtifact = (artifactName, fileName) => {
              try {
                return fs.readFileSync(path.join(artifacts, artifactName, fileName), 'utf8').trim();
              } catch {
                return null;
              }
            };

            // -- Code Guidelines section ---------------------------------------
            const guidelineChecks = ['lint', 'format', 'build', 'typecheck'];

            const guidelineResults = guidelineChecks.map(name => {
              const raw = readArtifact(`guidelines-${name}`, 'check-result.txt');
              return { name, passed: raw === 'success', available: raw !== null };
            });

            const guidelinesReq = guidelineResults
              .map(({ name, passed, available }) =>
                available
                  ? `${passed ? '✅' : '❌'} \`${name}\``
                  : `⚠️ \`${name}\` (result unavailable)`
              )
              .join('\n');

            const guidelinesFailed = guidelineResults.some(r => !r.passed);

            const guidelinesSection = [
              '## 🔧 Code Guidelines',
              '',
              '### Requirements',
              '',
              guidelinesReq,
              '',
              '### Errors',
              '',
              guidelinesFailed
                ? `One or more checks failed. Check the [CI logs](${runUrl}) for details.`
                : '_No errors_',
            ].join('\n');

            // -- Tests section (built by verify-code-coverage) -----------------
            const testsSection =
              readArtifact('section-tests', 'section-tests.md') ??
              '## 🧪 Tests\n\n_Section unavailable — check [CI logs](' + runUrl + ')._';

            // -- PR Metadata section (built by verify-pr-metadata) -------------
            const metadataSection =
              readArtifact('section-metadata', 'section-metadata.md') ??
              '## 📋 PR Metadata\n\n_Section unavailable — check [CI logs](' + runUrl + ')._';

            // -- Codecov placeholder (filled in by pr-codecov-review.yml) ------
            const codecovSection = [
              CODECOV_START,
              '## 📊 Codecov',
              '',
              '### Requirements',
              '',
              '⏳ `codecov/project`',
              '⏳ `codecov/patch`',
              '',
              '### Errors',
              '',
              '_Awaiting Codecov report..._',
              CODECOV_END,
            ].join('\n');

            // -- Overall header ------------------------------------------------
            const hasNonCodecovErrors =
              guidelinesFailed ||
              process.env.COVERAGE_RESULT === 'failure' ||
              process.env.METADATA_RESULT  === 'failure';

            // ⏳ = waiting for codecov, ❌ = already failing without it
            const headerIcon = hasNonCodecovErrors ? '❌' : '⏳';

            // -- Assemble full review body -------------------------------------
            const message = [
              MARKER,
              SHA_MARKER,
              '',
              `# ${headerIcon} PR Validation Status`,
              '',
              guidelinesSection,
              '',
              testsSection,
              '',
              metadataSection,
              '',
              codecovSection,
            ].join('\n');

            // -- Dismiss previous bot review if any ---------------------------
            const { data: reviews } = await github.rest.pulls.listReviews({ owner, repo, pull_number });
            const previous = reviews
              .filter(r => r.user.type === 'Bot' && r.body?.includes(MARKER))
              .reverse()[0];

            if (previous && previous.state !== 'DISMISSED') {
              await github.rest.pulls.dismissReview({
                owner, repo, pull_number,
                review_id: previous.id,
                message: 'Superseded by a new quality check.',
              });
            }

            // -- Post review ---------------------------------------------------
            // REQUEST_CHANGES if non-codecov errors already found;
            // COMMENT while waiting for Codecov (pr-codecov-review.yml will APPROVE or REQUEST_CHANGES later)
            const event = hasNonCodecovErrors ? 'REQUEST_CHANGES' : 'COMMENT';
            await github.rest.pulls.createReview({ owner, repo, pull_number, body: message, event });

            if (hasNonCodecovErrors) {
              core.setFailed('PR quality checks failed');
            }
