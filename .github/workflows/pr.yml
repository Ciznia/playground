name: verify pr definition
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  verify-code-guidelines:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./virtuotech-api
    strategy:
      fail-fast: false
      matrix:
        actions:
          - name: lint
            command: "lint"
          - name: test
            command: "test"
          - name: format
            command: "format -- --check"
          - name: build
            command: "build"
          - name: typecheck
            command: "typecheck"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
          package-manager-cache: true
          cache-dependency-path: "./virtuotech-api/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: verify ${{ matrix.actions.name }}
        run: npm run ${{ matrix.actions.command }}

  verify-pr-metadata:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./virtuotech-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
          package-manager-cache: true
          cache-dependency-path: "./virtuotech-api/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Validate PR commits with commitlint
        if: github.event_name == 'pull_request'
        run: npx --no-install commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Validate PR title with commitlint
        env:
          GITHUB_PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$GITHUB_PR_TITLE" | npx --no-install commitlint --verbose
