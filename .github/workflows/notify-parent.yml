name: Notify parent repo on develop push

on:
  push:
    branches:
      - develop

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch to parent
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GH_PARENT_REPO_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'VIRTUOOS-APP',
              repo: 'virtuoos-v2',
              event_type: 'submodule-updated',
              client_payload: {
                submodule: 'virtuoos-backend-v2'
              }
            })
